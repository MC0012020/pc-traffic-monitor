name: Build and release Windows x64
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate original application icon
        shell: pwsh
        run: |
          python -m pip install Pillow==12.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Pillow installation failed' }
          python make_icon.py
          if ($LASTEXITCODE -ne 0) { throw 'Icon generation failed' }
      - name: Run unit tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go test -count=1 -v ./... | Tee-Object -FilePath dist/test-results.txt
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed' }
      - name: Validate real Windows TCP and UDP capture twice
        shell: pwsh
        env:
          PCMONITOR_LIVE_ETW: '1'
        run: |
          go test -count=2 -timeout=3m -run '^TestETWLiveTraffic$' -v ./... | Tee-Object -FilePath dist/test-results.txt -Append
          if ($LASTEXITCODE -ne 0) { throw 'Real network capture tests failed; release blocked' }
      - name: Build portable Windows x64 GUI
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^(3|\d+\.\d+\.\d+)$') { throw 'Invalid version' }
          $short = $version -replace '\.0$',''
          $exe = "PcTrafficMonitor_V$short.exe"
          go build -trimpath -ldflags='-s -w -H windowsgui' -o "dist/$exe" .
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          $public = $version.Split('.')[0]
          $publicExe = "PcTrafficMonitor_V$public.exe"
          if ($exe -ne $publicExe) { Copy-Item "dist/$exe" "dist/$publicExe" }
          Compress-Archive -LiteralPath @("dist/$publicExe",'README.md','CHANGELOG.md') -DestinationPath "dist/PcTrafficMonitor_V${public}_Portable.zip" -CompressionLevel Optimal
          Copy-Item app.ico,icon_windows_amd64.syso dist/
          $files = Get-ChildItem dist -File | Sort-Object Name
          $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PcTrafficMonitor-windows-x64
          path: dist/
          if-no-files-found: error
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PcTrafficMonitor-windows-x64
          path: dist
      - name: Verify and publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^(3|[0-9]+\.[0-9]+\.[0-9]+)$ ]]
          tag="v$version"
          (cd dist && sha256sum -c SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists: $tag. Bump VERSION for a new release."
          else
            gh release create "$tag" dist/*.exe dist/*_Portable.zip dist/SHA256SUMS.txt dist/test-results.txt dist/app.ico dist/icon_windows_amd64.syso --target "$GITHUB_SHA" --title "PcTrafficMonitor V${version%%.*}" --notes-file RELEASE_NOTES.md --prerelease
          fi
      - name: Verify current release and clean old versions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          tag="v$version"
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$GITHUB_SHA" ]] || exit 0
          short="${version%.0}"
          mkdir -p verified-release
          gh release download "$tag" --pattern "PcTrafficMonitor_V$short.exe" --pattern 'SHA256SUMS.txt' --dir verified-release
          cmp dist/SHA256SUMS.txt verified-release/SHA256SUMS.txt
          cmp "dist/PcTrafficMonitor_V$short.exe" "verified-release/PcTrafficMonitor_V$short.exe"
          # Keep a single release; remove only older numeric release tags.
          gh release list --limit 100 --json tagName --jq '.[].tagName' > old-releases.txt
          while IFS= read -r old; do
            [[ "$old" != "$tag" && "$old" =~ ^v[0-9]+(\.[0-9]+\.[0-9]+)?$ ]] || continue
            [[ "$(printf '%s\n%s\n' "$old" "$tag" | sort -V | tail -1)" == "$tag" ]] || continue
            gh release delete "$old" --cleanup-tag --yes
          done < old-releases.txt
          gh release list --limit 100 --json tagName --jq '.[].tagName'
